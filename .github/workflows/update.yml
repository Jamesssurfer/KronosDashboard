name: Trigger Dashboard Update

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: Install Dependencies
        run: |
          pip install MetaTrader5
          # Note: MT5 might not work on GitHub Actions without a Windows server
          # or Wine for Linux
      
      - name: Compile Dashboard File
        env:
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: python run_analysis.py
      
      - name: Deploy Resulting HTML File
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add index.html
          git commit -m "update: automated panel compile" || exit 0
          git push origin master
