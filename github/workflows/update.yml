name: Trigger Dashboard Update
on:
  workflow_dispatch: # Allows you to run it manually by pushing a button

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install Data Tools
        run: pip install yfinance
      - name: Compile Dashboard File
        run: python run_analysis.py
      - name: Deploy Resulting HTML File
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "actions@github.com"
          git add notion_index.html
          git commit -m "update: automated panel compile" || exit 0
          git push
